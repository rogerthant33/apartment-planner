# Mutation testing for the pure packages. See CLAUDE.md "Testing".
# The archive and fixture tests are included because only they notice a change
# to CURRENT_SCHEMA_VERSION.
# `uv run` in the test command: on Windows a bare `python` resolves to the
# base interpreter, not the venv.
[cosmic-ray]
module-path = [
    "src/apartment_planner/geometry",
    "src/apartment_planner/model",
    "src/apartment_planner/persistence/autosave.py",
]
excluded-modules = ["src/apartment_planner/*/__init__.py"]
timeout = 60.0
test-command = "uv run --no-sync python -m pytest -x -q -p no:cacheprovider --hypothesis-profile=mutation tests/geometry tests/model tests/persistence/test_autosave.py tests/persistence/test_archive.py tests/persistence/test_fixtures.py"

[cosmic-ray.distributor]
name = "local"
